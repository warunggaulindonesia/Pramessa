<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRAMESSA CAPITAL — Capital Operating System</title>
    <style>
        :root {
            --bg: #0a0e17;
            --bg2: #0f1520;
            --bg3: #151c2b;
            --surface: #111827;
            --surface2: #1a2332;
            --border: #1f2b3d;
            --border2: #2a3a52;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text3: #64748b;
            --accent: #3b82f6;
            --accent2: #2563eb;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --glow: rgba(59, 130, 246, 0.15);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --radius: 6px;
            --radius-sm: 4px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
            --sidebar-w: 260px;
            --sidebar-collapsed: 64px;
            --header-h: 52px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --modal-overlay: rgba(0, 0, 0, 0.6);
        }
        [data-theme="light"] {
            --bg: #f4f6f9;
            --bg2: #eef1f5;
            --bg3: #e4e9f0;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --border: #dde3ec;
            --border2: #cbd5e1;
            --text: #0f172a;
            --text2: #475569;
            --text3: #94a3b8;
            --accent: #2563eb;
            --accent2: #1d4ed8;
            --glow: rgba(37, 99, 235, 0.08);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }
        #app-root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            height: var(--header-h);
            min-height: var(--header-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            z-index: 100;
            flex-shrink: 0;
        }
        .app-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width var(--transition), min-width var(--transition);
            overflow: hidden;
            z-index: 90;
            flex-shrink: 0;
        }
        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
            min-width: var(--sidebar-collapsed);
        }
        .sidebar.collapsed .nav-label,
        .sidebar.collapsed .sidebar-section-title,
        .sidebar.collapsed .sidebar-logo-text {
            display: none;
        }
        .sidebar.collapsed .nav-item {
            justify-content: center;
            padding: 10px 4px;
        }
        .sidebar-logo-icon {
            padding: 0px 30px;
    gap: 10px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.sidebar-logo-icon img {
    width: 40px;
    height: 40px;
    display: block;
    object-fit: contain;
}
        .sidebar-logo-text {
            padding: 12px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            color: var(--text);
        }
        .sidebar-logo-text small {
            font-weight: 400;
            font-size: 9px;
            color: var(--text2);
            display: block;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 6px 6px;
        }
        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 2px;
        }
        .sidebar-section {
            margin-top: 10px;
        }
        .sidebar-section-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text3);
            padding: 6px 10px;
            font-weight: 600;
            white-space: nowrap;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text2);
            text-decoration: none;
            transition: background var(--transition), color var(--transition);
            white-space: nowrap;
            font-size: 12px;
            font-weight: 500;
            user-select: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-item:hover {
            background: var(--bg2);
            color: var(--text);
        }
        .nav-item.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 12px var(--glow);
        }
        .nav-item .nav-icon {
            width: 18px;
            text-align: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .nav-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 20px;
            background: var(--bg);
            position: relative;
        }
        .content-area::-webkit-scrollbar {
            width: 6px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 3px;
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            align-items: center;
            justify-content: center;
        }
        .mobile-menu-btn:hover {
            background: var(--bg2);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            z-index: 80;
            border: none;
        }
        .sidebar-overlay.visible {
            display: block;
        }
        .mobile-drawer-open .sidebar {
            transform: translateX(0) !important;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: var(--header-h);
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform var(--transition);
                z-index: 85;
                width: 280px !important;
                min-width: 280px !important;
                box-shadow: var(--shadow);
            }
            .sidebar.collapsed {
                width: 280px !important;
                min-width: 280px !important;
            }
            .sidebar.collapsed .nav-label,
            .sidebar.collapsed .sidebar-section-title,
            .sidebar.collapsed .sidebar-logo-text {
                display: block;
            }
            .sidebar.collapsed .nav-item {
                justify-content: flex-start;
                padding: 8px 10px;
            }
            .mobile-menu-btn {
                display: flex;
            }
            .content-area {
                padding: 10px 8px;
            }
            .sidebar-overlay.visible {
                display: block;
            }
        }
        @media (max-width: 480px) {
            .content-area {
                padding: 6px 4px;
            }
            .app-header {
                padding: 0 6px;
                gap: 4px;
            }
        }
        .app-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .app-header-title {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-header-title small {
            font-weight: 400;
            font-size: 9px;
            color: var(--text2);
            display: block;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .app-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 10px 6px 30px;
            font-size: 12px;
            color: var(--text);
            width: 180px;
            transition: width var(--transition), border-color var(--transition);
            outline: none;
            font-family: var(--font);
        }
        .search-input:focus {
            border-color: var(--accent);
            width: 220px;
            box-shadow: 0 0 0 2px var(--glow);
        }
        .search-icon {
            position: absolute;
            left: 8px;
            font-size: 13px;
            color: var(--text3);
            pointer-events: none;
        }
        .search-results {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            left: 0;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            max-height: 320px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            min-width: 260px;
        }
        .search-results.visible {
            display: block;
        }
        .search-result-item {
            padding: 8px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item:hover {
            background: var(--bg2);
        }
        .search-result-type {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            background: var(--glow);
            padding: 2px 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .btn {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
        }
        .btn:hover {
            border-color: var(--accent);
            background: var(--bg2);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent2);
            border-color: var(--accent2);
        }
        .btn-danger {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
        }
        .btn-xs {
            padding: 2px 6px;
            font-size: 10px;
        }
        .btn-icon {
            padding: 6px 8px;
            font-size: 14px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text2);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }
        .metric-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            cursor: pointer;
            transition: border-color var(--transition);
        }
        .metric-card:hover {
            border-color: var(--accent);
        }
        .metric-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text3);
            font-weight: 600;
        }
        .metric-value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
            font-family: var(--mono);
            letter-spacing: -0.5px;
        }
        .metric-sub {
            font-size: 10px;
            color: var(--text2);
            margin-top: 2px;
        }
        .metric-value.positive {
            color: var(--green);
        }
        .metric-value.negative {
            color: var(--red);
        }
        .metric-value.warning {
            color: var(--amber);
        }
        .table-wrap {
            overflow-x: auto;
            margin: 0 -4px;
            padding: 0 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th {
            text-align: left;
            padding: 8px 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text3);
            border-bottom: 1px solid var(--border2);
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            color: var(--text);
        }
        td {
            padding: 7px 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover td {
            background: var(--bg2);
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
        }
        .badge-red {
            background: rgba(239, 68, 68, 0.15);
            color: var(--red);
        }
        .badge-amber {
            background: rgba(245, 158, 11, 0.15);
            color: var(--amber);
        }
        .badge-blue {
            background: rgba(59, 130, 246, 0.15);
            color: var(--blue);
        }
        .badge-purple {
            background: rgba(139, 92, 246, 0.15);
            color: var(--purple);
        }
        .badge-gray {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text2);
        }
        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--text3);
        }
        .empty-state-icon {
            font-size: 36px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        .empty-state-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 6px;
        }
        .empty-state-text {
            font-size: 12px;
            max-width: 320px;
            margin: 0 auto 14px;
            line-height: 1.6;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.15s ease;
        }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 560px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 0;
            animation: slideUp 0.2s ease;
        }
        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 1;
        }
        .modal-body {
            padding: 16px;
        }
        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            position: sticky;
            bottom: 0;
            background: var(--surface);
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text2);
            margin-bottom: 4px;
        }
        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            background: var(--bg2);
            color: var(--text);
            font-size: 12px;
            font-family: var(--font);
            outline: none;
            transition: border-color var(--transition);
        }
        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--glow);
        }
        .form-textarea {
            min-height: 70px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .form-hint {
            font-size: 10px;
            color: var(--text3);
            margin-top: 3px;
        }
        .form-error {
            font-size: 10px;
            color: var(--red);
            margin-top: 3px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .init-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            gap: 10px;
            text-align: center;
            padding: 20px;
        }
        .init-logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .init-sub {
            font-size: 11px;
            color: var(--text2);
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .init-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 10px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .init-error {
            color: var(--red);
            font-size: 13px;
            max-width: 400px;
        }
        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text2);
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            font-family: var(--font);
            white-space: nowrap;
        }
        .tab:hover {
            color: var(--text);
        }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .cal-weekday {
            text-align: center;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text3);
            font-weight: 700;
            padding: 6px 0;
        }
        .cal-cell {
            min-height: 60px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px;
            cursor: pointer;
            background: var(--surface);
            transition: border-color var(--transition), background var(--transition);
            position: relative;
            overflow: hidden;
        }
        .cal-cell:hover {
            border-color: var(--accent);
            background: var(--bg2);
        }
        .cal-cell.other-month {
            opacity: 0.35;
        }
        .cal-cell.today {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--glow);
        }
        .cal-cell.win {
            border-left: 3px solid var(--green);
        }
        .cal-cell.loss {
            border-left: 3px solid var(--red);
        }
        .cal-cell.breakeven {
            border-left: 3px solid var(--blue);
        }
        .cal-cell.mixed {
            border-left: 3px solid var(--purple);
        }
        .cal-date {
            font-size: 11px;
            font-weight: 600;
            font-family: var(--mono);
            color: var(--text2);
            margin-bottom: 2px;
        }
        .cal-day-trades {
            font-size: 9px;
            color: var(--text3);
            line-height: 1.3;
        }
        .cal-day-pnl {
            font-size: 9px;
            font-weight: 600;
            font-family: var(--mono);
        }
        .cal-day-pnl.positive {
            color: var(--green);
        }
        .cal-day-pnl.negative {
            color: var(--red);
        }
        @media (max-width: 600px) {
            .cal-cell {
                min-height: 40px;
                padding: 2px;
            }
            .cal-date {
                font-size: 9px;
            }
            .cal-day-trades,

    <script>
        (function() {
            'use strict';

            // ==================== APP CONFIG ====================
            const DB_NAME = 'pramessa_capital_db';
            const DB_VERSION = 3;
            const APP_NAME = 'PRAMESSA CAPITAL';
            const APP_TAGLINE = 'CAPITAL OPERATING SYSTEM';
            const DEFAULT_CURRENCY = 'USD';
            const DEFAULT_RISK_THRESHOLDS = { safe: 4, caution: 6, breach: 8 };

            const STORES = {
                SETTINGS: 'settings',
                AUDIT: 'audit_events',
                NOTIFICATIONS: 'notifications',
                SYSTEM_EVENTS: 'system_events',
                PROP_FIRMS: 'prop_firms',
                PROP_ACCOUNTS: 'prop_accounts',
                TRADES: 'trades',
                WITHDRAWALS: 'withdrawals',
                OPERATIONAL_TASKS: 'operational_tasks',
                CALENDAR_EVENTS: 'calendar_events',
                OPERATIONAL_RULES: 'operational_rules',
                OPERATIONAL_EVENTS: 'operational_events',
                ACCOUNTS: 'accounts',
                JOURNAL_ENTRIES: 'journal_entries',
                JOURNAL_LINES: 'journal_lines',
                RECEIVABLES: 'receivables',
                PAYABLES: 'payables',
                CASH_ACCOUNTS: 'cash_accounts',
                RECONCILIATIONS: 'reconciliations',
                ACCOUNTING_PERIODS: 'accounting_periods',
                ACCOUNTING_EXCEPTIONS: 'accounting_exceptions',
                CAPITAL_POOLS: 'capital_pools',
                CAPITAL_EVENTS: 'capital_events',
                ALLOCATION_PROFILES: 'allocation_profiles',
                ALLOCATION_RULES: 'allocation_rules',
                ALLOCATION_SNAPSHOTS: 'allocation_snapshots',
                CAPITAL_TRANSFERS: 'capital_transfers',
                INVESTMENTS: 'investments',
                POSITIONS: 'positions',
                INVESTMENT_TRANSACTIONS: 'investment_transactions',
                VALUATIONS: 'valuations',
                PERFORMANCE_SNAPSHOTS: 'performance_snapshots',
                ALLOCATION_TARGETS: 'allocation_targets',
                EXPOSURES: 'exposures',
                INVESTMENT_THESES: 'investment_theses',
                RESEARCH_NOTES: 'research_notes',
                WATCHLIST: 'watchlist',
                INVESTMENT_DECISIONS: 'investment_decisions',
                DECISION_REVIEWS: 'decision_reviews',
                RISK_RULES: 'risk_rules',
                RISK_LIMITS: 'risk_limits',
                RISK_REGISTER: 'risk_register',
                RISK_SNAPSHOTS: 'risk_snapshots',
                RISK_EVENTS: 'risk_events',
                RISK_EXCEPTIONS: 'risk_exceptions',
                RISK_REVIEWS: 'risk_reviews',
                STRESS_TESTS: 'stress_tests',
                SCENARIOS: 'scenarios',
                WORKFLOW_EVENTS: 'workflow_events',
                INBOX: 'inbox',
                IMPORT_JOBS: 'import_jobs',
                MIGRATIONS: 'migrations',
            };

            // ==================== STATE ====================
            let state = {
                appState: 'booting', // booting | initializing | ready | error | recovering
                db: null,
                dbReady: false,
                currentRoute: '',
                sidebarCollapsed: false,
                mobileDrawerOpen: false,
                theme: 'dark',
                settings: null,
                searchResults: [],
                qaOpen: false,
                currentDate: new Date(),
                calendarView: { year: new Date().getFullYear(), month: new Date().getMonth() },
                activeTab: {},
                notifications: [],
                demoMode: false,
            };

            // ==================== UTILITIES ====================
            function generateId(prefix) {
                return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
            }

            function generateShortId(prefix) {
                return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 10);
            }

            function nowISO() {
                return new Date().toISOString();
            }

            function todayStr() {
                return new Date().toISOString().slice(0, 10);
            }

            function formatMoney(val, currency) {
                const c = currency || (state.settings && state.settings.baseCurrency) || DEFAULT_CURRENCY;
                if (val === null || val === undefined || isNaN(val) || !isFinite(val)) return '—';
                const num = Number(val);
                if (Math.abs(num) >= 1e6) return (num < 0 ? '-' : '') + c + ' ' + (Math.abs(num) / 1e6).toFixed(2) + 'M';
                if (Math.abs(num) >= 1e3) return (num < 0 ? '-' : '') + c + ' ' + (Math.abs(num) / 1e3).toFixed(2) + 'K';
                return (num < 0 ? '-' : '') + c + ' ' + Math.abs(num).toFixed(2);
            }

            function formatPct(val) {
                if (val === null || val === undefined || isNaN(val) || !isFinite(val)) return '—';
                return Number(val).toFixed(2) + '%';
            }

            function formatNumber(val, digits) {
                if (val === null || val === undefined || isNaN(val) || !isFinite(val)) return '—';
                return Number(val).toFixed(digits || 2);
            }

            function formatDate(dateStr) {
                if (!dateStr) return '—';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const fmt = (state.settings && state.settings.dateFormat) || 'YYYY-MM-DD';
                if (fmt === 'MM/DD/YYYY') {
                    return (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getDate().toString().padStart(2,
                        '0') + '/' + d.getFullYear();
                }
                if (fmt === 'DD/MM/YYYY') {
                    return d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2,
                        '0') + '/' + d.getFullYear();
                }
                return d.getFullYear() + '-' + (d.getMonth() + 1).toString().padStart(2, '0') + '-' + d.getDate()
                    .toString().padStart(2, '0');
            }

            function formatDateTime(dateStr) {
                if (!dateStr) return '—';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return formatDate(dateStr) + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes()
                    .toString().padStart(2, '0');
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,
                    '&quot;').replace(/'/g, '&#39;');
            }

            function safeNumber(val, fallback) {
                if (val === null || val === undefined || val === '') return fallback !== undefined ? fallback : 0;
                const n = Number(val);
                return isNaN(n) ? (fallback !== undefined ? fallback : 0) : n;
            }

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function deepClone(obj) {
                if (!obj) return obj;
                try { return JSON.parse(JSON.stringify(obj)); } catch (e) { return null; }
            }

            function truncateStr(str, len) {
                if (!str) return '';
                return str.length > len ? str.slice(0, len) + '...' : str;
            }

            function getDayKey(dateStr) {
                if (!dateStr) return '';
                return String(dateStr).slice(0, 10);
            }

            function isToday(dateStr) {
                return getDayKey(dateStr) === todayStr();
            }

            function debounce(fn, delay) {
                let timer = null;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }

            // ==================== DATABASE ====================
            function openDatabase() {
                return new Promise((resolve, reject) => {
                    if (!('indexedDB' in window)) {
                        reject(new Error('IndexedDB is not available in this browser.'));
                        return;
                    }
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = function(event) {
                        const db = event.target.result;
                        const oldVersion = event.oldVersion || 0;
                        runMigrations(db, oldVersion, event.target.transaction);
                    };
                    request.onsuccess = function(event) {
                        resolve(event.target.result);
                    };
                    request.onerror = function(event) {
                        reject(new Error('Failed to open IndexedDB: ' + (event.target.error && event.target
                            .error.message || 'Unknown error')));
                    };
                    request.onblocked = function(event) {
                        reject(new Error('Database upgrade blocked. Please close other tabs and retry.'));
                    };
                });
            }

            function runMigrations(db, oldVersion, transaction) {
                // Create all stores with keyPath 'id'
                const storeDefs = {};
                Object.values(STORES).forEach(storeName => {
                    storeDefs[storeName] = { keyPath: 'id', autoIncrement: false };
                });

                Object.entries(storeDefs).forEach(([storeName, def]) => {
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName, { keyPath: def.keyPath, autoIncrement: def
                                .autoIncrement || false });
                    }
                });

                // Create indexes for common lookup fields
                const indexDefs = [
                    { store: STORES.AUDIT, idx: 'timestamp', keyPath: 'timestamp' },
                    { store: STORES.AUDIT, idx: 'entityType', keyPath: 'entityType' },
                    { store: STORES.TRADES, idx: 'date', keyPath: 'date' },
                    { store: STORES.TRADES, idx: 'propAccountId', keyPath: 'propAccountId' },
                    { store: STORES.TRADES, idx: 'propFirmId', keyPath: 'propFirmId' },
                    { store: STORES.TRADES, idx: 'result', keyPath: 'result' },
                    { store: STORES.PROP_ACCOUNTS, idx: 'propFirmId', keyPath: 'propFirmId' },
                    { store: STORES.PROP_ACCOUNTS, idx: 'status', keyPath: 'status' },
                    { store: STORES.INVESTMENTS, idx: 'assetClass', keyPath: 'assetClass' },
                    { store: STORES.INVESTMENTS, idx: 'status', keyPath: 'status' },
                    { store: STORES.RISK_REGISTER, idx: 'status', keyPath: 'status' },
                    { store: STORES.RISK_EVENTS, idx: 'status', keyPath: 'status' },
                    { store: STORES.JOURNAL_ENTRIES, idx: 'postedDate', keyPath: 'postedDate' },
                    { store: STORES.JOURNAL_ENTRIES, idx: 'status', keyPath: 'status' },
                    { store: STORES.WITHDRAWALS, idx: 'status', keyPath: 'status' },
                    { store: STORES.CALENDAR_EVENTS, idx: 'eventDate', keyPath: 'eventDate' },
                    { store: STORES.INVESTMENT_DECISIONS, idx: 'status', keyPath: 'status' },
                    { store: STORES.RISK_LIMITS, idx: 'status', keyPath: 'status' },
                    { store: STORES.ALLOCATION_PROFILES, idx: 'status', keyPath: 'status' },
                ];

                indexDefs.forEach(def => {
                    try {
                        const store = transaction.objectStore(def.store);
                        if (store && !store.indexNames.contains(def.idx)) {
                            store.createIndex(def.idx, def.keyPath, { unique: false });
                        }
                    } catch (e) {
                        // Index might already exist, ignore
                    }
                });

                // Record migration
                try {
                    const migStore = transaction.objectStore(STORES.MIGRATIONS);
                    migStore.put({
                        id: 'mig_' + Date.now(),
                        version: DB_VERSION,
                        oldVersion: oldVersion,
                        timestamp: nowISO(),
                        description: 'Auto migration to version ' + DB_VERSION,
                    });
                } catch (e) {
                    // Ignore if migrations store not yet available
                }
            }

            async function initDatabase() {
                if (state.db && state.dbReady) return state.db;
                const db = await openDatabase();
                state.db = db;
                state.dbReady = true;
                return db;
            }

            function dbAdd(storeName, record) {
                return new Promise((resolve, reject) => {
                    if (!state.db || !state.dbReady) { reject(new Error('DB not ready')); return; }
                    const tx = state.db.transaction(storeName, 'readwrite');
                    tx.onerror = (e) => reject(e.target.error);
                    tx.objectStore(storeName).put(record);
                    tx.oncomplete = () => resolve(record);
                });
            }

            function dbGet(storeName, id) {
                return new Promise((resolve, reject) => {
                    if (!state.db || !state.dbReady) { reject(new Error('DB not ready')); return; }
                    const tx = state.db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).get(id);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function dbGetAll(storeName) {
                return new Promise((resolve, reject) => {
                    if (!state.db || !state.dbReady) { reject(new Error('DB not ready')); return; }
                    const tx = state.db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function dbGetByIndex(storeName, indexName, value) {
                return new Promise((resolve, reject) => {
                    if (!state.db || !state.dbReady) { reject(new Error('DB not ready')); return; }
                    const tx = state.db.transaction(storeName, 'readonly');
                    const idx = tx.objectStore(storeName).index(indexName);
                    const req = idx.getAll(value);
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function dbUpdate(storeName, id, updates) {
                return new Promise((resolve, reject) => {
                    if (!state.db || !state.dbReady) { reject(new Error('DB not ready')); return; }
                    const tx = state.db.transaction(storeName, 'readwrite');
                    tx.onerror = (e) => reject(e.target.error);
                    const store = tx.objectStore(storeName);
                    const getReq = store.get(id);
                    getReq.onsuccess = () => {
                        const existing = getReq.result;
                        if (!existing) { reject(new Error('Record not found: ' + id)); return; }
                        const updated = { ...existing, ...updates, updatedAt: nowISO() };
                        store.put(updated);
                        tx.oncomplete = () => resolve(updated);
                    };
                    getReq.onerror = (e) => reject(e.target.error);
                });
            }

            function dbDelete(storeName, id) {
                return new Promise((resolve, reject) => {
                    if (!state.db || !state.dbReady) { reject(new Error('DB not ready')); return; }
                    const tx = state.db.transaction(storeName, 'readwrite');
                    tx.onerror = (e) => reject(e.target.error);
                    tx.objectStore(storeName).delete(id);
                    tx.oncomplete = () => resolve(true);
                });
            }

            function dbCount(storeName) {
                return new Promise((resolve, reject) => {
                    if (!state.db || !state.dbReady) { reject(new Error('DB not ready')); return; }
                    const tx = state.db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).count();
                    req.onsuccess = () => resolve(req.result || 0);
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            // ==================== AUDIT ENGINE ====================
            async function recordAudit(action, entityType, entityId, before, after, note, functionalContext) {
                try {
                    const auditRecord = {
                        id: generateId('audit'),
                        timestamp: nowISO(),
                        action: action,
                        entityType: entityType,
                        entityId: entityId || null,
                        beforeValue: before ? JSON.stringify(before) : null,
                        afterValue: after ? JSON.stringify(after) : null,
                        note: note || '',
                        functionalContext: functionalContext || 'General',
                    };
                    await dbAdd(STORES.AUDIT, auditRecord);
                    return auditRecord;
                } catch (e) {
                    console.warn('Audit record failed:', e);
                    return null;
                }
            }

            // ==================== CALCULATION ENGINE ====================
            function calcNetPnL(grossPnl, fees) {
                const g = safeNumber(grossPnl);
                const f = safeNumber(fees);
                return g - f;
            }

            function calcRMultiple(netPnl, riskAmount) {
                const n = safeNumber(netPnl);
                const r = safeNumber(riskAmount);
                if (r === 0) return null;
                return n / r;
            }

            function calcWinRate(wins, losses, breakEvens) {
                const total = wins + losses + breakEvens;
                if (total === 0) return null;
                return (wins / total) * 100;
            }

            function calcLossRate(wins, losses, breakEvens) {
                const total = wins + losses + breakEvens;
                if (total === 0) return null;
                return (losses / total) * 100;
            }

            function calcBreakEvenRate(wins, losses, breakEvens) {
                const total = wins + losses + breakEvens;
                if (total === 0) return null;
                return (breakEvens / total) * 100;
            }

            function calcPortfolioWeight(positionValue, totalPortfolioValue) {
                const pv = safeNumber(positionValue);
                const tv = safeNumber(totalPortfolioValue);
                if (tv === 0) return null;
                return (pv / tv) * 100;
            }

            function calcAllocationDrift(actualWeight, targetWeight) {
                const aw = safeNumber(actualWeight);
                const tw = safeNumber(targetWeight);
                return aw - tw;
            }

            function calcUnrealizedPnL(currentValue, costBasis) {
                const cv = safeNumber(currentValue);
                const cb = safeNumber(costBasis);
                return cv - cb;
            }

            function calcRealizedPnL(exitValue, costBasis) {
                const ev = safeNumber(exitValue);
                const cb = safeNumber(costBasis);
                return ev - cb;
            }

            function calcReturnPct(currentValue, costBasis) {
                const cv = safeNumber(currentValue);
                const cb = safeNumber(costBasis);
                if (cb === 0) return null;
                return ((cv - cb) / cb) * 100;
            }

            function calcRiskScore(probability, impact) {
                const p = safeNumber(probability);
                const i = safeNumber(impact);
                return p * i;
            }

            function calcRiskStatus(score, thresholds) {
                const t = thresholds || (state.settings && state.settings.riskThresholds) || DEFAULT_RISK_THRESHOLDS;
                const s = safeNumber(score);
                if (s >= safeNumber(t.breach, 8)) return 'CRITICAL';
                if (s >= safeNumber(t.caution, 6)) return 'BREACH';
                if (s >= safeNumber(t.safe, 4)) return 'CAUTION';
                return 'SAFE';
            }

            function validateJournalEntry(debits, credits) {
                const totalDebits = debits.reduce((sum, d) => sum + safeNumber(d.amount), 0);
                const totalCredits = credits.reduce((sum, c) => sum + safeNumber(c.amount), 0);
                const diff = totalDebits - totalCredits;
                return { balanced: Math.abs(diff) < 0.005, totalDebits, totalCredits, diff };
            }

            function calcTotalCapital() {
                // Total capital = sum of all capital pools
                const pools = getCachedData(STORES.CAPITAL_POOLS);
                return pools.reduce((sum, p) => sum + safeNumber(p.balance), 0);
            }

            function calcAvailableCapital() {
                const pools = getCachedData(STORES.CAPITAL_POOLS);
                const unallocated = pools.filter(p => p.poolType === 'unallocated' || p.poolType === 'operating' || p
                    .poolType === 'reserve');
                return unallocated.reduce((sum, p) => sum + safeNumber(p.balance), 0);
            }

            function calcCashBalance() {
                const cashAccounts = getCachedData(STORES.CASH_ACCOUNTS);
                return cashAccounts.reduce((sum, ca) => sum + safeNumber(ca.balance), 0);
            }

            // ==================== CACHED DATA ====================
            const dataCache = {};

            function getCachedData(storeName) {
                return dataCache[storeName] || [];
            }

            function setCachedData(storeName, data) {
                dataCache[storeName] = data || [];
            }

            async function refreshCache(storeNames) {
                const stores = storeNames || Object.values(STORES);
                for (const storeName of stores) {
                    try {
                        const data = await dbGetAll(storeName);
                        setCachedData(storeName, data);
                    } catch (e) {
                        setCachedData(storeName, []);
                    }
                }
            }

            async function refreshAllCache() {
                const storeList = Object.values(STORES);
                await refreshCache(storeList);
            }

            // ==================== ROUTER ====================
            const routes = {};
            let currentRenderCleanup = null;

            function registerRoute(path, renderFn) {
                routes[path] = renderFn;
            }

            function navigateTo(route) {
                if (!route) route = '#/executive';
                if (!route.startsWith('#')) route = '#' + route;
                if (window.location.hash !== route) {
                    window.location.hash = route;
                } else {
                    handleRouteChange();
                }
            }

            function getCurrentRoute() {
                const hash = window.location.hash || '#/executive';
                return hash.replace(/^#/, '') || '/executive';
            }

            function handleRouteChange() {
                const route = getCurrentRoute();
                state.currentRoute = route;
                renderPage(route);
                updateSidebarActive();
                if (window.innerWidth <= 768) {
                    closeMobileDrawer();
                }
            }

            function renderPage(route) {
                const contentArea = document.getElementById('page-content');
                if (!contentArea) return;
                const cleanRoute = route.replace(/^#?/, '');
                // Try exact match first
                let renderFn = routes[cleanRoute] || routes['/' + cleanRoute] || routes[cleanRoute.replace(/^\//, '')];
                if (!renderFn) {
                    // Try to match by prefix (e.g., /operations/trades → /operations)
                    const parts = cleanRoute.split('/').filter(Boolean);
                    if (parts.length > 0) {
                        renderFn = routes['/' + parts[0]] || routes[parts[0]];
                    }
                }
                if (!renderFn) {
                    renderFn = routes['/executive'] || routes['executive'];
                }
                if (currentRenderCleanup && typeof currentRenderCleanup === 'function') {
                    try { currentRenderCleanup(); } catch (e) {}
                    currentRenderCleanup = null;
                }
                try {
                    renderFn(contentArea);
                } catch (e) {
                    console.error('Render error for route:', route, e);
                    contentArea.innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Render Error</div><div class="empty-state-text">' +
                        escapeHtml(e.message) + '</div></div>';
                }
            }

            function updateSidebarActive() {
                const route = state.currentRoute;
                document.querySelectorAll('.nav-item').forEach(item => {
                    const href = item.getAttribute('data-route') || '';
                    const cleanHref = href.replace(/^#/, '');
                    const cleanRoute = route.replace(/^#/, '');
                    const isActive = cleanHref === cleanRoute || cleanRoute.startsWith(cleanHref + '/') || (
                        cleanHref && cleanRoute.startsWith(cleanHref));
                    item.classList.toggle('active', isActive);
                });
            }

            // ==================== GLOBAL SEARCH ====================
            function setupSearch() {
                const searchInput = document.getElementById('global-search');
                const searchResults = document.getElementById('search-results');
                if (!searchInput || !searchResults) return;
                const debouncedSearch = debounce(async function(query) {
                    if (!query || query.trim().length < 2) {
                        searchResults.classList.remove('visible');
                        searchResults.innerHTML = '';
                        return;
                    }
                    const q = query.trim().toLowerCase();
                    const results = [];
                    const searchStores = [
                        { store: STORES.PROP_FIRMS, type: 'Prop Firm', route: '#/operations/prop-firms', match: (
                                r) => r.firmName },
                        { store: STORES.PROP_ACCOUNTS, type: 'Prop Account', route: '#/operations/prop-accounts',
                            match: (r) => r.accountName + ' ' + r.accountReference },
                        { store: STORES.TRADES, type: 'Trade', route: '#/operations/trades', match: (r) => r
                                .instrument + ' ' + r.strategy },
                        { store: STORES.WITHDRAWALS, type: 'Withdrawal', route: '#/operations/withdrawals',
                            match: (r) => r.reference + ' ' + r.propFirmName },
                        { store: STORES.INVESTMENTS, type: 'Investment', route: '#/fund/investments', match: (r) => r
                                .name + ' ' + r.assetClass },
                        { store: STORES.JOURNAL_ENTRIES, type: 'Journal Entry', route: '#/accounting/entries',
                            match: (r) => r.reference + ' ' + r.description },
                        { store: STORES.RISK_REGISTER, type: 'Risk', route: '#/risk/register', match: (r) => r
                                .description },
                        { store: STORES.INVESTMENT_DECISIONS, type: 'Investment Decision',
                            route: '#/fund/decisions', match: (r) => r.decision + ' ' + r.thesis },
                        { store: STORES.OPERATIONAL_TASKS, type: 'Task', route: '#/operations/tasks', match: (r) => r
                                .title },
                        { store: STORES.CALENDAR_EVENTS, type: 'Calendar Event', route: '#/calendar', match: (r) => r
                                .title },
                    ];
                    for (const s of searchStores) {
                        const data = getCachedData(s.store);
                        for (const rec of data) {
                            const matchStr = (s.match(rec) || '').toLowerCase();
                            if (matchStr.includes(q)) {
                                results.push({ type: s.type, route: s.route, label: matchStr.slice(0, 60),
                                    id: rec.id });
                            }
                        }
                        if (results.length > 15) break;
                    }
                    searchResults.innerHTML = results.length > 0 ?
                        results.map(r => `
                            <div class="search-result-item" data-route="${r.route}" data-id="${r.id}">
                                <span class="search-result-type">${r.type}</span>
                                <span>${escapeHtml(r.label)}</span>
                            </div>
                        `).join('') :
                        '<div class="search-result-item" style="color:var(--text3)">No results found</div>';
                    searchResults.classList.add('visible');
                    searchResults.querySelectorAll('[data-route]').forEach(el => {
                        el.addEventListener('click', function() {
                            const route = this.getAttribute('data-route');
                            searchResults.classList.remove('visible');
                            searchInput.value = '';
                            navigateTo(route);
                        });
                    });
                }, 250);
                searchInput.addEventListener('input', function() { debouncedSearch(this.value); });
                searchInput.addEventListener('blur', function() {
                    setTimeout(() => searchResults.classList.remove('visible'), 200);
                });
                searchInput.addEventListener('focus', function() {
                    if (searchInput.value.trim().length >= 2) debouncedSearch(searchInput.value);
                });
            }

                    </div>
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">Credit Account</label>
                            <select class="form-select" id="f-je-credit-account">${accounts.map(a => `<option value="${a.id}" ${existing&&existing.creditAccountId===a.id?'selected':''}>${escapeHtml(a.accountCode + ' ' + a.name)}</option>`).join('') || '<option value="">—</option>'}</select></div>
                        <div class="form-group"><label class="form-label">Credit Amount</label><input type="number" step="any" class="form-input" id="f-je-credit-amt" value="${existing ? existing.creditAmount : ''}"></div>
                    </div>
                    <div class="form-hint" id="f-je-balance" style="margin-top:8px;font-weight:600;"></div>
                `, {
                    title: isEdit ? 'Edit Journal Entry' : 'New Journal Entry',
                    maxWidth: '560px',
                    footer: `<button class="btn" data-cancel>Cancel</button><button class="btn btn-primary" data-save>${isEdit?'Update':'Save'}</button>`
                });
                const modal = document.querySelector('[data-modal-id]');
                const updateBalance = () => {
                    const dr = safeNumber(modal?.querySelector('#f-je-debit-amt')?.value);
                    const cr = safeNumber(modal?.querySelector('#f-je-credit-amt')?.value);
                    const diff = dr - cr;
                    const balEl = modal?.querySelector('#f-je-balance');
                    if (balEl) {
                        balEl.textContent = 'Balance: ' + formatMoney(diff) + (Math.abs(diff) < 0.005 ? ' ✓' :
                            ' ⚠ UNBALANCED');
                        balEl.style.color = Math.abs(diff) < 0.005 ? 'var(--green)' : 'var(--red)';
                    }
                };
                modal?.querySelector('#f-je-debit-amt')?.addEventListener('input', updateBalance);
                modal?.querySelector('#f-je-credit-amt')?.addEventListener('input', updateBalance);
                updateBalance();
                modal?.querySelector('[data-cancel]')?.addEventListener('click', closeModal);
                modal?.querySelector('[data-save]')?.addEventListener('click', async () => {
                    const dr = safeNumber(modal.querySelector('#f-je-debit-amt').value);
                    const cr = safeNumber(modal.querySelector('#f-je-credit-amt').value);
                    if (Math.abs(dr - cr) >= 0.005) {
                        showToast('Entry is unbalanced. Debits must equal credits.', 'error');
                        return;
                    }
                    const data = {
                        reference: modal.querySelector('#f-je-ref').value || generateShortId('JE'),
                        description: modal.querySelector('#f-je-desc').value,
                        postedDate: modal.querySelector('#f-je-date').value,
                        debitAccountId: modal.querySelector('#f-je-debit-account').value,
                        debitAmount: dr,
                        creditAccountId: modal.querySelector('#f-je-credit-account').value,
                        creditAmount: cr,
                        status: 'posted',
                    };
                    if (isEdit && existing && existing.status === 'posted') {
                        showToast('Posted entries are immutable. Use reversal.', 'error');
                        return;
                    }
                    if (isEdit) {
                        const updated = { ...existing, ...data, updatedAt: nowISO() };
                        await dbUpdate(STORES.JOURNAL_ENTRIES, existing.id, updated);
                        await recordAudit('UPDATE', 'journal_entry', existing.id, existing, updated,
                            'Journal entry updated', 'Accounting');
                    } else {
                        data.id = generateId('je');
                        data.createdAt = nowISO();

            function renderExecutiveDashboard(container) {
                const trades = getCachedData(STORES.TRADES);
                const investments = getCachedData(STORES.INVESTMENTS);
                const propAccounts = getCachedData(STORES.PROP_ACCOUNTS);
                const withdrawals = getCachedData(STORES.WITHDRAWALS);
                const riskRegister = getCachedData(STORES.RISK_REGISTER);
                const tasks = getCachedData(STORES.OPERATIONAL_TASKS);
                const decisions = getCachedData(STORES.INVESTMENT_DECISIONS);
                const pools = getCachedData(STORES.CAPITAL_POOLS);
                const cashAccounts = getCachedData(STORES.CASH_ACCOUNTS);
                const journalEntries = getCachedData(STORES.JOURNAL_ENTRIES);

                const totalCapital = pools.reduce((s, p) => s + safeNumber(p.balance), 0);
                const corpCash = cashAccounts.reduce((s, ca) => s + safeNumber(ca.balance), 0);
                const tradingCapital = pools.filter(p => p.poolType === 'trading').reduce((s, p) => s + safeNumber(p
                    .balance), 0);
                const investmentCapital = pools.filter(p => p.poolType === 'investment').reduce((s, p) => s + safeNumber(
                    p.balance), 0);
                const operatingCash = pools.filter(p => p.poolType === 'operating').reduce((s, p) => s + safeNumber(p
                    .balance), 0);
                const totalPnl = trades.reduce((s, t) => s + safeNumber(t.netPnl), 0);
                const wins = trades.filter(t => t.result === 'WIN').length;
                const losses = trades.filter(t => t.result === 'LOSS').length;
                const breakEvens = trades.filter(t => t.result === 'BREAK EVEN').length;
                const totalPortfolioValue = investments.filter(i => i.status === 'Active').reduce((s, i) => s + safeNumber(
                    i.currentValue), 0);
                const totalCostBasis = investments.filter(i => i.status === 'Active').reduce((s, i) => s + safeNumber(i
                    .costBasis), 0);
                const activeBreaches = riskRegister.filter(r => r.status === 'BREACH' || r.status === 'CRITICAL');
                const recentWithdrawals = withdrawals.slice(-5).reverse();
                const recentDecisions = decisions.slice(-5).reverse();
                const activeAccounts = propAccounts.filter(a => a.status === 'Funded' || a.status === 'Active');
                const pendingTasks = tasks.filter(t => t.status === 'Pending' || t.status === 'In Progress');

                const winRate = calcWinRate(wins, losses, breakEvens);

                container.innerHTML = `

                                    <div class="metric-label">Investment Capital</div>

            function renderTradingCalendar(container) {
                const trades = getCachedData(STORES.TRADES);
                const year = state.calendarView.year;
                const month = state.calendarView.month;
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startWeekday = firstDay.getDay(); // 0=Sun
                const monthKey = year + '-' + String(month + 1).padStart(2, '0');
                const monthTrades = trades.filter(t => t.date && t.date.startsWith(monthKey));
                const tradesByDay = {};
                monthTrades.forEach(t => {
                    const key = getDayKey(t.date);
                    if (!tradesByDay[key]) tradesByDay[key] = [];
                    tradesByDay[key].push(t);
                });
                const todayKey = todayStr();

                let cells = '';
                const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
                for (let i = 0; i < totalCells; i++) {
                    const dayNum = i - startWeekday + 1;
                    const isInMonth = dayNum >= 1 && dayNum <= daysInMonth;
                    const dateObj = new Date(year, month, dayNum);
                    const dateStr = dateObj.toISOString().slice(0, 10);
                    const isToday = dateStr === todayKey;
                    const dayTrades = tradesByDay[dateStr] || [];
                    const dayClass = isInMonth ? (isToday ? 'today' : '') : 'other-month';
                    const resultClasses = [];
                    if (dayTrades.some(t => t.result === 'WIN')) resultClasses.push('win');
                    if (dayTrades.some(t => t.result === 'LOSS')) resultClasses.push('loss');
                    if (dayTrades.some(t => t.result === 'BREAK EVEN')) resultClasses.push('breakeven');
                    if (resultClasses.length > 1) {
                        resultClasses.length = 0;
                        resultClasses.push('mixed');
                    }
                    const dailyNet = dayTrades.reduce((s, t) => s + safeNumber(t.netPnl), 0);
                    const dailyR = dayTrades.filter(t => t.rMultiple !== null && t.rMultiple !== undefined);
                    const avgR = dailyR.length > 0 ? dailyR.reduce((s, t) => s + safeNumber(t.rMultiple), 0) / dailyR
                        .length : null;
                    cells += `<div class="cal-cell ${dayClass} ${resultClasses.join(' ')}" data-date="${dateStr}">
                        <div class="cal-date">${dayNum}</div>
                        ${dayTrades.length > 0 ? `
                            <div class="cal-day-trades">${dayTrades.length} trade${dayTrades.length>1?'s':''}</div>
                            <div class="cal-day-trades">${dayTrades.filter(t=>t.result==='WIN').length}W · ${dayTrades.filter(t=>t.result==='LOSS').length}L · ${dayTrades.filter(t=>t.result==='BREAK EVEN').length}BE</div>
                            <div class="cal-day-pnl ${dailyNet>=0?'positive':'negative'}">${formatMoney(dailyNet)}</div>
                            ${avgR!==null?`<div class="cal-day-trades">R: ${formatNumber(avgR,2)}</div>`:''}
                        ` : ''}
                    </div>`;
                }

                container.innerHTML = `
                    <div class="flex-between mb-14">
                        <h2 style="font-size:16px;font-weight:700;">Trading Performance Calendar</h2>
                        <div class="gap-8">
                            <button class="btn btn-sm" onclick="changeCalendarMonth(-1)">←</button>
                            <select class="btn btn-sm" onchange="changeCalendarYear(this.value)">
                                ${Array.from({length: 5}, (_, i) => year - 2 + i).map(y => `<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
                            </select>
                            <select class="btn btn-sm" onchange="changeCalendarMonthTo(this.value)">
                                ${['January','February','March','April','May','June','July','August','September','October','November','December'].map((m, i) => `<option value="${i}" ${i===month?'selected':''}>${m}</option>`).join('')}
                            </select>
                            <button class="btn btn-sm" onclick="changeCalendarMonth(1)">→</button>
                            <button class="btn btn-sm" onclick="resetCalendarToday()">Today</button>
                        </div>
                    </div>
                    <div class="calendar-grid">
                        ${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => `<div class="cal-weekday">${d}</div>`).join('')}
                        ${cells}
                    </div>
                    <div id="cal-day-details" class="card mt-14" style="display:none;"></div>
                `;
                container.querySelectorAll('.cal-cell').forEach(cell => {
                    cell.addEventListener('click', function() {
                        const dateStr = this.getAttribute('data-date');
                        const dayTrades = tradesByDay[dateStr] || [];
                        const detailsEl = container.querySelector('#cal-day-details');
                        if (dayTrades.length > 0) {
                            detailsEl.style.display = 'block';

                                <div class="table-wrap"><table>
                                    <thead><tr><th>Instrument</th><th>Result</th><th>Net P&L</th><th>R</th><th>Strategy</th><th>Actions</th></tr></thead>
                                    <tbody>${dayTrades.map(t => `<tr>
                                        <td>${escapeHtml(t.instrument || '—')}</td>

                                        /openTradeForm\(getCachedData\('([^']+)'\)\.find\(x=>x\.id==='([^']+)'\)\)/

                                    if (match) {

            async function createRiskEvent() {
                const trades = getCachedData(STORES.TRADES);
                const totalPnl = trades.reduce((s, t) => s + safeNumber(t.netPnl), 0);
                const investments = getCachedData(STORES.INVESTMENTS);
                const activeInv = investments.filter(i => i.status === 'Active');
                const totalValue = activeInv.reduce((s, i) => s + safeNumber(i.currentValue), 0);
                const concentration = totalValue > 0 ? activeInv.reduce((max, i) => Math.max(max,
                    safeNumber(i.currentValue)), 0) / totalValue * 100 : 0;
                const severity = concentration > 30 ? 'CRITICAL' : concentration > 20 ? 'HIGH' : 'MEDIUM';
                const data = {
                    id: generateId('re'),

                    description: concentration > 20 ? 'Portfolio concentration exceeds 20% threshold' :

                    severity: concentration > 20 ? severity : 'LOW',

                    const json = JSON.parse(text);
                    if (!json.data || typeof json.data !== 'object') {
                        showToast('Invalid backup file format', 'error');
                        return;
                    }
                    showConfirm('Import backup? This will overwrite ALL current data. This action cannot be undone.', async () => {
                            for (const storeName of Object.values(STORES)) {
                                const records = json.data[storeName] || [];
                                for (const rec of records) {
                                    try { await dbAdd(storeName, rec); } catch (e) { /* skip invalid */ }

                            await refreshAllCache();
                            renderPage(state.currentRoute);
                            showToast('Backup imported successfully', 'success');
                        }, { confirmText: 'Import & Overwrite', title: 'Import Backup' });
                } catch (e) {
                    showToast('Failed to parse backup: ' + e.message, 'error');
                }
                event.target.value = '';
            }

            function renderCalendar(container) {
                const events = getCachedData(STORES.CALENDAR_EVENTS);
                const year = state.calendarView.year;
                const month = state.calendarView.month;
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startWeekday = firstDay.getDay();
                const monthKey = year + '-' + String(month + 1).padStart(2, '0');
                const monthEvents = events.filter(e => e.eventDate && e.eventDate.startsWith(monthKey));
                const eventsByDay = {};
                monthEvents.forEach(e => { const k = getDayKey(e.eventDate); if (!eventsByDay[k]) eventsByDay[k] = [];
                    eventsByDay[k].push(e); });
                let cells = '';
                const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
                for (let i = 0; i < totalCells; i++) {
                    const dayNum = i - startWeekday + 1;
                    const isInMonth = dayNum >= 1 && dayNum <= daysInMonth;
                    const dateObj = new Date(year, month, dayNum);
                    const dateStr = dateObj.toISOString().slice(0, 10);
                    const dayEvents = eventsByDay[dateStr] || [];
                    cells += `<div class="cal-cell ${isInMonth?'':'other-month'}" data-date="${dateStr}">
                        <div class="cal-date">${dayNum}</div>
                        ${dayEvents.length > 0 ? `<div class="cal-day-trades">${dayEvents.map(e => escapeHtml(e.title)).join(', ')}</div>` : ''}
                    </div>`;
                }
                container.innerHTML = `

                        <h2 style="font-size:16px;font-weight:700;">Calendar</h2>
                        <div class="gap-8">
                            <button class="btn btn-sm" onclick="changeCalendarMonth(-1)">←</button>

                        if (dayEvents.length > 0) {
                            showModal(`<div class="form-group">${dayEvents.map(e =>
                                `<div class="audit-entry"><span>${escapeHtml(e.title)}</span><span class="text-xs text-muted">${escapeHtml(e.category)}</span></div>`
                                ).join('')}</div>`, { title: formatDate(dateStr) });
                        }
                    });
                });
            }

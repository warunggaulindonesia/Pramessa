            // ==================== INITIALIZATION ====================
            async function initialize() {
                const initScreen = document.getElementById('init-screen');
                const mainApp = document.getElementById('main-app');
                const initStatus = document.getElementById('init-status');
                const initSpinner = document.getElementById('init-spinner');
                const initError = document.getElementById('init-error');
                const initActions = document.getElementById('init-actions');

                try {
                    initStatus.textContent = 'CHECKING COMPATIBILITY...';
                    if (!('indexedDB' in window)) {
                        throw new Error('IndexedDB is not available in this browser. The application requires IndexedDB for persistence.');
                    }

                    initStatus.textContent = 'OPENING DATABASE...';
                    await initDatabase();

                    initStatus.textContent = 'LOADING DATA...';
                    await refreshAllCache();

                    initStatus.textContent = 'LOADING SETTINGS...';
                    const settingsData = getCachedData(STORES.SETTINGS);
                    state.settings = settingsData.length > 0 ? settingsData[0] : { id: 'main', companyName: 'Pramessa Capital',
                        baseCurrency: 'USD', fiscalYear: 'Calendar', theme: 'dark',
                        dateFormat: 'YYYY-MM-DD', riskThresholds: DEFAULT_RISK_THRESHOLDS };
                    if (!settingsData.length) {
                        await dbAdd(STORES.SETTINGS, state.settings);
                        await refreshCache([STORES.SETTINGS]);
                    }
                    state.theme = state.settings.theme || 'dark';
                    applyTheme();

                    initStatus.textContent = 'CHECKING DEMO DATA...';
                    const hasData = await dbCount(STORES.TRADES) > 0 || await dbCount(STORES.PROP_FIRMS) > 0;
                    if (!hasData) {
                        initStatus.textContent = 'SEEDING DEMO DATA...';
                        await seedDemoData();
                        await refreshAllCache();
                    }

                    initStatus.textContent = 'INITIALIZING ROUTER...';
                    registerAllRoutes();

                    initStatus.textContent = 'BUILDING INTERFACE...';
                    buildSidebarNav();
                    setupSearch();
                    setupQuickActions();

                    // Restore sidebar state
                    try {
                        const collapsed = localStorage.getItem('pc_sidebar_collapsed');
                        if (collapsed === '1') state.sidebarCollapsed = true;
                    } catch (e) {}
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar && state.sidebarCollapsed) sidebar.classList.add('collapsed');

                    // Setup event listeners
                    document.getElementById('mobile-menu-btn')?.addEventListener('click', openMobileDrawer);
                    document.getElementById('sidebar-overlay')?.addEventListener('click', closeMobileDrawer);
                    document.getElementById('sidebar-toggle-btn')?.addEventListener('click', toggleSidebar);
                    document.getElementById('theme-toggle')?.addEventListener('click', function() {
                        state.theme = state.theme === 'dark' ? 'light' : 'dark';
                        applyTheme();
                        if (state.settings?.id) {
                            const updated = { ...state.settings, theme: state.theme };
                            dbUpdate(STORES.SETTINGS, state.settings.id, updated);
                            state.settings = updated;
                        }
                    });
                    window.addEventListener('hashchange', handleRouteChange);

                    // Mark ready and show app
                    state.appState = 'ready';
                    initStatus.textContent = 'READY';
                    initScreen.style.display = 'none';
                    mainApp.style.display = 'flex';
                    mainApp.style.flexDirection = 'column';

                    // Initial route
                    handleRouteChange();

                } catch (err) {
                    console.error('Initialization failed:', err);
                    state.appState = 'error';
                    initStatus.textContent = 'SYSTEM INITIALIZATION FAILED';
                    initSpinner.style.display = 'none';
                    initError.style.display = 'block';
                    initError.textContent = err.message || 'Unknown error';
                    initActions.style.display = 'flex';
                    initActions.innerHTML = `
                        <button class="btn btn-primary btn-sm" onclick="location.reload()">Reload Application</button>
                        <button class="btn btn-sm" onclick="forceReset()">Clear Local Database</button>
                    `;
                }
            }

            function forceReset() {
                showConfirm('⚠️ Clear local database? This will permanently delete all data and reload the application.', () => {
